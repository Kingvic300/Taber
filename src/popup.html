<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabora</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon-32.png" alt="" width="20" height="20">
      <strong>Tabora</strong>
      <span id="stats" class="muted"></span>
    </div>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <nav class="nav" role="tablist">
    <button role="tab" data-panel="tabs" aria-selected="true">Tabs</button>
    <button role="tab" data-panel="sessions" aria-selected="false">Sessions</button>
    <button role="tab" data-panel="snoozed" aria-selected="false">Snoozed <span id="snoozeCount"></span></button>
    <button role="tab" data-panel="statsPanel" aria-selected="false">Stats</button>
  </nav>

  <!-- Tabs -->
  <section id="tabs" class="panel">
    <input id="search" type="search" placeholder="Search tabs… (Enter to switch)" autocomplete="off" spellcheck="false">
    <div class="actions">
      <button class="btn" data-action="groupAll" title="Join tabs by topic or site">Group</button>
      <button class="btn" data-action="ungroupAll">Ungroup</button>
      <button class="btn" data-action="sleepOthers" title="Unload every tab except the open ones to free memory">Sleep others</button>
      <button class="btn" data-action="mergeWindows" title="Move every tab into this window">Merge windows</button>
      <button class="btn" data-action="closeDuplicates" id="dupBtn">Close duplicates</button>
      <button class="btn" data-action="closeOld" id="oldBtn">Close old</button>
    </div>
    <div class="view-toggle" role="tablist">
      <button role="tab" data-view="window" aria-selected="true">By window</button>
      <button role="tab" data-view="site" aria-selected="false">By group</button>
      <button role="tab" data-view="old" aria-selected="false">Oldest first</button>
      <button role="tab" data-view="cpu" aria-selected="false">Most CPU</button>
    </div>
    <div id="list" class="list"></div>
    <details id="closedSection" class="closed">
      <summary>Recently closed <span id="closedCount" class="muted"></span></summary>
      <div id="closedList"></div>
      <button id="clearLog" class="link">Clear history</button>
    </details>
  </section>

  <!-- Sessions -->
  <section id="sessions" class="panel" hidden>
    <form id="saveForm" class="save-form">
      <input id="sessionName" type="text" placeholder="Session name (optional)" autocomplete="off">
      <div class="save-row">
        <select id="sessionScope" aria-label="What to save">
          <option value="window">This window</option>
          <option value="all">All windows</option>
        </select>
        <label class="check"><input type="checkbox" id="sessionClose"> Close after saving</label>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
    <div id="sessionList" class="list"></div>
  </section>

  <!-- Snoozed -->
  <section id="snoozed" class="panel" hidden>
    <p class="hint muted">Snooze a tab with the clock button in the Tabs list. It closes now and opens again at the time you pick.</p>
    <div id="snoozeList" class="list"></div>
  </section>

  <!-- Stats -->
  <section id="statsPanel" class="panel" hidden>
    <div id="tiles" class="tiles"></div>
    <h3 class="sub-head">This week</h3>
    <div id="weekList" class="kv"></div>
    <h3 class="sub-head">Most visited sites</h3>
    <ol id="topSites" class="top-sites"></ol>
  </section>

  <div id="snoozeMenu" class="menu" role="menu" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
