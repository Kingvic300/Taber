<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Already open — Taber</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-size: 14px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgb(0 0 0 / .08);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .lead { margin: 0 0 18px; }
    .existing {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--surface-2);
      margin-bottom: 20px;
    }
    .existing .body { min-width: 0; }
    .existing .title, .existing .url {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .existing .title { font-weight: 600; }
    .existing .url { font-size: 12px; color: var(--muted); }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .buttons .btn { flex: 1; padding: 10px 14px; }
    kbd {
      font: 11px ui-monospace, monospace;
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 0 4px;
      opacity: .7;
      margin-left: 4px;
    }
    .foot { margin-top: 16px; font-size: 12px; }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>This page is already open</h1>
    <p class="lead muted" id="where">You have this page in another tab.</p>
    <div class="existing">
      <span class="favicon" id="fav" aria-hidden="true"></span>
      <div class="body">
        <div class="title" id="title"></div>
        <div class="url" id="url"></div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn primary" id="switch">Go to open tab<kbd>Enter</kbd></button>
      <button class="btn" id="open">Open new copy<kbd>N</kbd></button>
    </div>
    <p class="foot muted">Don't want this prompt? <a href="options.html" id="settings">Turn off duplicate check</a>.</p>
  </main>
  <script type="module" src="duplicate.js"></script>
</body>
</html>
